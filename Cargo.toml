[package]
name = "rust-sandbox"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
cortex-m-semihosting = "0.5"
panic-halt = "1.0.0"

[dependencies.stm32f4]
version = "0.15.1"
features = ["stm32f407"]

[[bin]]
name = "rust-sandbox"
test = false
bench = false

[profile.release]
codegen-units = 1 # better optimizations
debug = true # symbols are nice and they don't increase the size on Flash
lto = true # better optimizations